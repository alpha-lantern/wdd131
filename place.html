<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazil | WDD 131 | Alvin Timaná</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals. The country I visited in my mission: Brazil.">
    <meta name="author" content="Alvin Timaná">
    <link rel="stylesheet" href="styles/place.css">
    <!-- Font: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;600&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
            <h1>Brazil</h1>
    </header>
    <main>
        <picture class="hero">
            <source media="(min-width: 900px)" srcset="images/rj-hero-large.webp">
            <source media="(min-width: 550px)" srcset="images/rj-hero-medium.webp">
            <img src="images/rj-hero-mobile.webp" fetchpriority=high alt="Cristo Redentor. RJ, Brazil" width="1920" height="1080">
        </picture>

        <section class="card left">
            <h2>Data</h2>
            <table>
                <tr>
                    <th>Area:</th>
                    <td>8,516 millions km²</td>
                </tr>
                <tr>
                    <th>Population:</th>
                    <td>212 millions</td>
                </tr>
                <tr>
                    <th>Capital:</th>
                    <td>Brasilia</td>
                </tr>
                <tr>
                    <th>Languages:</th>
                    <td>Portuguese</td>
                </tr>
                <tr>
                    <th>Currency:</th>
                    <td>Real (R$) (BRL)</td>
                </tr>
                <tr>
                    <th>Time Zone:</th>
                    <td>UTC-2 to UTC-5</td>
                </tr>
                <tr>
                    <th>Calling Code:</th>
                    <td>+55</td>
                </tr>
                <tr>
                    <th>Internet TDL:</th>
                    <td>.br</td>
                </tr>
            </table>
        </section>
        <section class="card right">
            <h2>Weather <span>🌦️</span></h2>
            <img src="images/cloud-drizzle-weather.svg" alt="weather icon" width="25" height="25">
            <table>
                <tr>
                    <th>Temperature:</th>
                    <td id="temperature"></td>
                </tr>
                <tr>
                    <th>Conditions:</th>
                    <td id="conditions"></td>
                </tr>
                <tr>
                    <th>Wind:</th>
                    <td id="wind"></td>
                </tr>
                <tr>
                    <th>Wind Chill:</th>
                    <td id="windChill"></td>
                </tr>
            </table>
        </section>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> 🏆 Alvin Timaná 🏆 Lima, Perú</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
